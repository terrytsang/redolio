name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHPUnit (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, ctype, curl, fileinfo, tokenizer, bcmath, intl, gd, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install and build the front end
        run: |
          npm ci
          npm run build

      - name: Install the Chromium browser (used by the screenshot / visual-check tests)
        run: npx playwright install --with-deps chromium

      - name: Prepare the environment (no secrets are needed)
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the tests
        run: php artisan test
